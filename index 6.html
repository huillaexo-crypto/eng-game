<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Grade 1 - Colors</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(#cfefff,#fff);display:flex;justify-content:center;padding:20px}.card{max-width:800px;width:100%;background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.15);text-align:center}.badge{background:#4caf50;color:#fff;padding:8px 14px;border-radius:20px;display:inline-block}.scene{font-size:90px}.options{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}.btn{padding:18px;font-size:24px;border:none;border-radius:16px;color:#fff;cursor:pointer}.red{background:#e53935}.blue{background:#1e88e5}.green{background:#43a047}.yellow{background:#fbc02d;color:#222}#msg{margin-top:18px;font-size:22px;font-weight:bold}.hint{margin-top:10px}.retry,.hintBtn{margin-top:12px;padding:12px 20px;border:none;border-radius:12px;cursor:pointer}.reward{font-size:30px}</style></head><body><div class="card"><h1>🎨 English - Colors</h1><div class="badge">Score: <span id="score">0</span> ⭐</div><p><b>Instructions:</b> Click the correct color.</p><div class="scene">🎈</div><p>Ali wants a <b>red</b> balloon. Which color should he choose?</p><div class="options"><button class="btn red" onclick="check('red')">Red</button><button class="btn blue" onclick="check('blue')">Blue</button><button class="btn green" onclick="check('green')">Green</button><button class="btn yellow" onclick="check('yellow')">Yellow</button></div><button class="hintBtn" onclick="hint()">💡 Hint</button><div class="hint" id="hint"></div><div id="msg"></div><button class="retry" onclick="location.reload()">🔄 Try Again</button></div><script>function check(a){const m=document.getElementById('msg');if(a==='red'){document.getElementById('score').textContent='10';m.innerHTML='✅ Great job! The correct answer is Red. <div class="reward">🏆 +10 Stars</div>';m.style.color='green';}else{m.textContent='❌ Nice try! Choose the balloon color Red.';m.style.color='crimson';}}function hint(){document.getElementById('hint').textContent='The correct button has the same color as an apple 🍎.';}</script></body></html>
